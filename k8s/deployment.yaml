apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: demo-container
          image: 673084610131.dkr.ecr.ap-south-1.amazonaws.com/demo-app:latest
          ports:
            - containerPort: 80
